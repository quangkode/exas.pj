<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ExAS MRV - Hệ thống Đo lường, Báo cáo và Xác minh tín chỉ các-bon cho nông hộ trồng dừa theo phương pháp luận VM0042 của Verra">
    <title>ExAS MRV - Hệ thống Đo lường, Báo cáo & Xác minh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ============ LOGIN SCREEN ============ -->
    <div id="login-screen" class="login-screen">
        <div class="login-particles" id="login-particles"></div>
        <div class="login-container">
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fas fa-leaf"></i>
                </div>
                <h1>ExAS <span>MRV</span></h1>
                <p class="login-subtitle">Measurement · Reporting · Verification</p>
            </div>
            <form id="login-form" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="login-username">
                        <i class="fas fa-user"></i>
                        Tài khoản
                    </label>
                    <input type="text" id="login-username" placeholder="Nhập tài khoản" required>
                </div>
                <div class="form-group">
                    <label for="login-password">
                        <i class="fas fa-lock"></i>
                        Mật khẩu
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
                        <button type="button" class="toggle-password" id="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div id="login-error" class="login-error" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Tài khoản hoặc mật khẩu không đúng</span>
                </div>
                <button type="submit" class="login-btn" id="login-btn">
                    <span>Đăng nhập</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <div class="login-footer">
                <p>Hệ thống MRV theo phương pháp luận VM0042 - Verra</p>
            </div>
        </div>
    </div>

    <!-- ============ MAIN APP ============ -->
    <div id="app" class="app" style="display:none;">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <i class="fas fa-leaf"></i>
                    </div>
                    <div class="sidebar-logo-text">
                        <h2>ExAS</h2>
                        <span>MRV System</span>
                    </div>
                </div>
                <button id="sidebar-toggle" class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="sidebar-user">
                <div class="user-avatar" id="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <span class="user-name" id="user-display-name">--</span>
                    <span class="user-role" id="user-display-role">--</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul id="nav-menu">
                    <!-- Navigation items will be injected by JS based on role -->
                </ul>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Đăng xuất</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main id="main-content" class="main-content">
            <!-- TOP BAR -->
            <header class="topbar">
                <div class="topbar-left">
                    <button id="mobile-menu-btn" class="mobile-menu-btn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb" id="breadcrumb">
                        <span>Trang chủ</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="topbar-date" id="topbar-date"></div>
                    <button class="topbar-icon-btn" id="notification-btn" title="Thông báo">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notification-badge">3</span>
                    </button>
                </div>
            </header>

            <!-- PAGE CONTENT AREA -->
            <div class="page-content" id="page-content">
                <!-- Dynamic content loaded here -->
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="pages/audit.js"></script>
    <script src="pages/dashboard.js"></script>
    <script src="pages/farm-diary.js"></script>
    <script src="pages/measurement.js"></script>
    <script src="pages/verification.js"></script>
    <script src="pages/reporting.js"></script>
    <script src="pages/admin.js"></script>
    <script src="app.js"></script>
</body>
</html>
